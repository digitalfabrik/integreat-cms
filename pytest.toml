# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options

[pytest]
testpaths = [
    "tests",
]
markers = [
    "unit: Pure logic tests with no database or external service dependencies",
    "slow: Tests that take a long time or run many parametrized variants",
]
DJANGO_SETTINGS_MODULE = "integreat_cms.core.test_settings"