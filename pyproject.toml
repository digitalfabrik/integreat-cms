[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "integreat-cms"
description = "Content Management System for the Integreat App"
version = "2026.9.0"
authors = [{name = "Tür an Tür – Digitalfabrik gGmbH", email = "tech@integreat-app.de"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = [
    "integreat",
    "cms",
    "django",
    "e-government",
    "newcomers",
    "refugees",
    "multilingual",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "aiohttp",
    "argon2-cffi",
    "bcrypt",
    "cairosvg",
    "celery",
    "cffi",
    "deepl",
    "django-cacheops",
    "django-celery",
    "django-cors-headers",
    "django-db-mutex",
    "django-debug-toolbar",
    "django-import-export",
    "django-pgtrigger",
    "django-polymorphic",
    "django-redis",
    "django-treebeard",
    "django-webpack-loader",
    "django-widget-tweaks",
    "Django>=5.2,<6.0",
    "feedparser",
    "geopy",
    "google-auth",
    "google-cloud-translate",
    "gunicorn",
    "icalendar",
    "idna",
    "integreat-django-linkcheck",
    "ipython",
    "jsonschema",
    "lxml-html-clean",
    "lxml",
    "natsort",
    "Pillow",
    "psycopg[binary]",
    "pyotp",
    "python-dateutil",
    "python-magic",
    "pyyaml",
    "qrcode",
    "reportlab",
    "requests",
    "rules",
    "shortcodes",
    "six",
    "uvicorn",
    "webauthn",
    "xhtml2pdf",
]

[dependency-groups]
dev = [
    # Required by the release pipeline, which builds the distribution via `python3 -m build`
    "build",
    "bumpver",
    "debugpy",
    "djlint",
    "freezegun",
    "mypy",
    "myst-parser",
    # Required by the release pipeline, which queries (Test-)PyPI via `pip index versions`
    "pip",
    "pre-commit",
    "pyjwt",
    "pytest-cov",
    "pytest-django",
    "pytest-httpserver",
    "pytest-icdiff",
    "pytest-order",
    "pytest-testmon",
    "pytest-xdist",
    "requests-mock",
    "ruff",
    "shellcheck-py",
    "sphinx-last-updated-by-git",
    "sphinx-rtd-theme",
    "sphinx",
    "sphinxcontrib-django",
    "twine",
    "types-python-dateutil",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
"Homepage" = "https://integreat-app.de/en/"
"Source Code" = "https://github.com/digitalfabrik/integreat-cms"
"Issues" = "https://github.com/digitalfabrik/integreat-cms/issues"
"Release Notes" = "https://digitalfabrik.github.io/integreat-cms/release-notes.html"
"Documentation" = "https://digitalfabrik.github.io/integreat-cms/"
"Funding" = "https://integreat-app.de/en/donation/"

[tool.setuptools]
script-files = ["integreat_cms/integreat-cms-cli"]

[tool.setuptools.packages.find]
include = ["integreat_cms*"]

[tool.bumpver]
current_version = "2026.9.0"
version_pattern = "YYYY.MM.INC0[-TAG]"
commit_message = """
Bump version to {new_version}

[skip ci]
"""
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"integreat_cms/__init__.py" = [
    '__version__ = "{version}"',
]
"docs/src/conf.py" = [
    'release = "{version}"',
]

[tool.coverage.report]
fail_under = 50
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.djlint]
profile="django"
line_break_after_multiline_tag=true
# exclude invalid html files until this is resolved https://github.com/djlint/djLint/issues/703
exclude = "integreat_cms/api/v3/templates/"
recursive = true
ignore-paths = [
  ".venv",
  "node_modules",
  "build",
]
fail-on = "I"
extension-pkg-whitelist = ["lxml"]
django-settings-module="integreat_cms.core.settings"
ignore=[
  "H005", # Html tag should have lang attribute. <html>
]


[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
strict_equality = true
python_version = "3.13"

[tool.ruff]
line-length = 88
target-version = "py313"

# [tool.ruff.lint.pydocstyle]
# waiting for: https://github.com/astral-sh/ruff/issues/6606
# convention = "sphinx"

[tool.ruff.lint.pycodestyle]
max-doc-length = 279

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "AIR",    # Airflow
  "ARG",    # flake8-unused-arguments - TODO
  "ASYNC",  # flake8-async
  "ASYNC1", # flake8-trio
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # McCabe cyclomatic complexity
  "COM",    # flake8-commas
  # "D",    # pydocstyle - makes no sense until sphinx docstyle available
  "DJ",     # flake8-django
  "E",      # pycodestyle
  "ERA",    # eradicate
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "FA",     # flake8-future-annotations
  "FIX",    # flake8-fixme
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INP",    # flake8-no-pep420
  "INT",    # flake8-gettext
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "NPY",    # NumPy-specific rules
  "PD",     # pandas-vet
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # Pylint
  "PLC",    # Pylint conventions
  "PLE",    # Pylint errors
  "PLR",    # Pylint refactor
  "PLW",    # Pylint warnings
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TD",     # flake8-todos
  "TCH",    # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle
  "YTT",    # flake8-2020
  # "ANN",  # flake8-annotations
  # "CPY",  # flake8-copyright
  # "DTZ",  # flake8-datetimez
  # "EM",   # flake8-errmsg
  # "FBT",  # flake8-boolean-trap
  # "PT",   # flake8-pytest-style
  # "PTH",  # flake8-use-pathlib
  # "SLF",  # flake8-self
  # "TID",  # flake8-tidy-imports
]
ignore = [
  "ERA001", # Found commented-out code
  "FIX002", # Line contains TODO, consider resolving the issue
  "INP001",
  "N806",
  "N818",
  "N999",
  "PLC0415", # import not at top of file - imports inside functions are used deliberately to avoid circular imports and premature app registry access
  "PLR0917", # too many positional arguments - signatures are dictated by Django (view/form/widget overrides), decorators and pytest fixtures
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF012",
  "E501", # line too long - only applicable to strings and comments, everything else is auto-formatted by ruff
  "TD002", # Missing author in TODO
  "TD003", # Missing issue link for this TODO
  "TD004", # Missing colon in TODO
  "TD005", # Missing issue description after `TODO`
  "TRY003",
  "S308", # mark_safe may expose cross-site scripting vulnerabilities
  "COM812", # missing trailing comma - recommended to disable when using ruff formatter
  "ISC001", # single line implicit line concatenation - recommended to disable when using ruff formatter
]
extend-select = [
  "D419"
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))|request|region_slug|language_slug|queryset|commit$"


[tool.ruff.lint.mccabe]
max-complexity = 23  # default is 10

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tools/_analyze_force_merges.py" = ["T201"]
"docs/src/conf.py" = ["A001"]
"integreat_cms/api/v3/*" = ["PERF401"]
"integreat_cms/api/v3/social_media_headers.py" = ["FIX002"]
"integreat_cms/cms/forms/custom_model_form.py" = ["G003", "PERF401"]
"integreat_cms/cms/forms/linkcheck/link_replace_form.py" = ["W605"]
"integreat_cms/cms/forms/pages/page_form.py" = ["PLR5501"]
"integreat_cms/cms/forms/regions/region_form.py" = ["FIX002"]
"integreat_cms/cms/models/abstract_base_model.py" = ["BLE001", "DJ012"]
"integreat_cms/cms/models/poi_categories/poi_category.py" = ["DJ001"]
"integreat_cms/cms/models/push_notifications/push_notification.py" = ["DJ001"]
"integreat_cms/cms/models/users/user.py" = ["DJ001"]
"integreat_cms/cms/views/*" = ["PIE804"]
"integreat_cms/cms/views/analytics/app_size_view.py" = ["FIX002"]
"integreat_cms/core/*_settings.py" = ["F403"]
"integreat_cms/core/circleci_settings.py" = ["F405"]
"integreat_cms/core/management/commands/find_large_files.py" = ["G004"]
"integreat_cms/core/sphinx_settings.py" = ["F405"]
"integreat_cms/core/test_settings.py" = ["F405"]
"integreat_cms/google_translate_api/apps.py" = ["BLE001"]
"integreat_cms/google_translate_api/google_translate_api_client.py" = ["BLE001"]
"integreat_cms/nominatim_api/nominatim_api_client.py" = ["PERF401"]
"tests/*" = ["ARG001", "ARG002", "ARG005", "S101", "S105", "T201"]
"integreat_cms/cms/migrations/*" = ["T201"]
".circleci/*" = ["T201"]
"tests/deepl_api/deepl_api_test.py" = ["PIE804"]
"tests/pdf/test_pdf_export.py" = ["PLW2901"]
"tests/textlab_api/textlab_api_test.py" = ["A002"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["float", "int", "str"]
max-args = 8  # default is 5
max-bool-expr = 5  # default is 5
max-branches = 22  # default is 12
max-locals = 15  # default is 15
max-returns = 12  # default is 6
max-statements = 64  # default is 50

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["django.utils.functional.classproperty"]
