    "django-redis",
    "django-treebeard",
    "django-webpack-loader",
    "django-widget-tweaks",
    "Django>=5.2,<6.0",
    "feedparser",
    "geopy",
    "google-auth",
    "google-cloud-translate",
    "gunicorn",
    "icalendar",
    "idna",
    "integreat-django-linkcheck",
    "ipython",
    "jsonschema",
    "lxml-html-clean",
    "lxml",
    "natsort",
    "Pillow",
    "psycopg[binary]",
    "pyotp",
    "python-dateutil",
    "python-magic",
    "pyyaml",
    "qrcode",
