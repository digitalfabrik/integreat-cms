# Stripped-down Docker Compose environment for running CMS tests

name: integreat-cms-test

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: integreat-cms-dev:dev
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_completed_successfully
    environment:
      DJANGO_SETTINGS_MODULE: integreat_cms.core.test_settings
      # The invoking host uid has no passwd entry in the image; give pip and
      # friends a writable HOME for their caches.
      HOME: /tmp
      INTEGREAT_CMS_DB_HOST: db
      INTEGREAT_CMS_DB_PASSWORD: password
      INTEGREAT_CMS_DB_USER: integreat
      INTEGREAT_CMS_FCM_KEY: dummy
      INTEGREAT_CMS_SECRET_KEY: dummy
      REDIS_CACHE: False
    volumes:
      - ./integreat_cms:/app/integreat_cms
      - ./pytest.toml:/app/pytest.toml
      - ./tests-results:/app/tests-results
      - ./tests:/app/tests
      - ./tools:/app/tools
      - type: tmpfs
        target: /tmp
      # Mount an empty tmpfs into the pdf cache dir.
      - type: tmpfs
        target: /app/integreat_cms/pdf
        tmpfs:
          mode: 0o1777
      # Mount a volumes to let cms and web shared some files
      - dist:/app/integreat_cms/static/dist
      - shared:/app/integreat_cms/static/shared
  db:
    # https://hub.docker.com/_/postgres
    image: postgres:17-trixie
    restart: unless-stopped
    volumes:
      - type: tmpfs
        # When upgrading Postgres, thoroughly read https://hub.docker.com/_/postgres#pgdata
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: integreat
      POSTGRES_DB: integreat
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "integreat"]
      interval: 4s
      timeout: 16s
      retries: 2
      start_period: 4s
      start_interval: 4s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: integreat-cms-dev:dev
    pull_policy: build
    user: "${DOCKER_USER}"
    volumes:
      - ./.browserslistrc:/app/.browserslistrc
      - ./.prettierignore:/app/.prettierignore
      - ./.prettierrc:/app/.prettierrc
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - ./postcss.config.js:/app/postcss.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./webpack.config.js:/app/webpack.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./typedoc.json:/app/typedoc.json
      - ./integreat_cms/cms/templates:/app/integreat_cms/cms/templates
      - ./integreat_cms/static/src:/app/integreat_cms/static/src
      # Mount shared volumes to let cms and web share some files
      - dist:/app/integreat_cms/static/dist
      - shared:/app/integreat_cms/static/shared
    command: npm run build
    restart: no

volumes:
  dist:
  shared:
