{# PROTOTYPE: actions cell of a fake place row, shared by the normal and the translation view #}
    <td class="py-2 pr-4 align-middle">
        <div class="flex justify-end gap-1">
            <a href="{% url 'contacts_locations_place_edit' region_slug=request.region.slug place_id=place.id %}"
               class="flex h-[38px] items-center gap-2 rounded bg-blue-100 px-3 py-2 font-bold text-gray-700 hover:bg-blue-200">
                <i icon-name="pencil"></i>
                Bearbeiten
            </a>
            <div data-row-actions class="relative">
                <button type="button"
                        data-row-actions-toggle
                        title="Weitere Aktionen"
                        aria-label="Weitere Aktionen für {{ place.title }}"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        class="flex h-[38px] w-[44px] items-center justify-center rounded border-2 border-blue-200 bg-white text-gray-700 hover:border-blue-300">
                    <i icon-name="ellipsis"></i>
                </button>
                <div data-row-actions-menu
                     role="menu"
                     class="hidden fixed z-10 flex-col gap-4 w-max min-w-[228px] rounded border-2 border-blue-200 bg-white p-4 text-left shadow-[2px_6px_10px_rgba(51,65,85,0.5)]">
                    <div class="flex flex-col gap-4">
                        <button type="button"
                                role="menuitem"
                                class="flex items-center gap-2 whitespace-nowrap font-bold text-gray-700 hover:text-blue-500">
                            <i icon-name="external-link"></i>
                            In Web-App öffnen
                        </button>
                        <button type="button"
                                role="menuitem"
                                class="flex items-center gap-2 whitespace-nowrap font-bold text-gray-700 hover:text-blue-500">
                            <i icon-name="copy"></i>
                            Ort kopieren
                        </button>
                    </div>
                    <div class="flex flex-col gap-4 border-t border-gray-200 pt-4">
                        <button type="button"
                                role="menuitem"
                                class="flex items-center gap-2 whitespace-nowrap font-bold text-gray-700 hover:text-blue-500">
                            <i icon-name="archive"></i>
                            Ort archivieren
                        </button>
                        <button type="button"
                                role="menuitem"
                                class="flex items-center gap-2 whitespace-nowrap font-bold text-red-500 hover:text-red-700">
                            <i icon-name="trash-2"></i>
                            Ort löschen
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </td>
