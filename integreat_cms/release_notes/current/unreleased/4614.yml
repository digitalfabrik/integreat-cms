en: Allow multiple regions to share a Zammad server while other regions use their own Zammad server and store the region and language in the Zammad ticket attributes "region_slug" and "language_slug"
de: Mehrere Regionen können sich einen Zammad-Server teilen, während andere Regionen einen eigenen Zammad-Server nutzen, und Region und Sprache werden in den Zammad-Ticketattributen "region_slug" und "language_slug" gespeichert
